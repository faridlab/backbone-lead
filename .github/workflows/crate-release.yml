name: Crate release

# Gate every change and publish to crates.io from CI (ADR-0030): a pull request
# builds, tests, audits the package and dry-runs the publish; a push to main whose
# Cargo.toml version is not on crates.io yet publishes it and then tags v<version>.
# Releasing is: bump `version`, merge. Needs the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  crate:
    uses: faridlab/backbone-framework/.github/workflows/crate-release.yml@main
    secrets: inherit
